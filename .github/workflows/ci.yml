name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  RUST_BACKTRACE: full

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustfmt:
    name: rustfmt / linux / stable
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rust
        run: |
          rustup update --no-self-update stable
          rustup component add rustfmt

      - name: cargo fmt -- --check
        run: |
          cargo fmt -- --check

  clippy:
    name: clippy / linux / stable
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rust
        run: |
          rustup update --no-self-update stable
          rustup component add clippy

      - name: cargo clippy
        run: |
          cargo clippy --locked --all --examples

  test:
    name: test / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      matrix:
        include:
          - name: linux / stable
            rust: stable
          - name: linux / stable --no-default-features
            rust: stable
            args: --no-default-features
          - name: linux / beta
            rust: beta
          - name: linux / nightly
            rust: nightly
          - name: linux / nightly -Z minimal-versions
            rust: nightly
            minimal_versions: true
          - name: linux / 1.63.0
            rust: 1.63.0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rust
        run: |
          rustup default ${{ matrix.rust }}
          rustup update --no-self-update ${{ matrix.rust }}

      - name: Update dependencies for minimal versions
        if: matrix.minimal_versions
        run: cargo update -Zminimal-versions

      - name: Test
        run: |
          cargo test --locked ${{ matrix.args }}
